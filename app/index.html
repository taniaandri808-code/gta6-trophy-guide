<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Trophy Atlas — GTA VI platinum guide &amp; tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="brand">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <div>
      <h1>LEONIDA <em>TROPHY ATLAS</em></h1>
      <p class="tagline">An unofficial, offline guide &amp; progress tracker for the 55 PS5 trophies of Grand Theft Auto VI</p>
    </div>
  </div>
  <div class="tally">
    <div class="tally-num"><strong id="earned-count">0</strong><span>/ 55</span></div>
    <div class="bar" role="progressbar" aria-label="Trophies earned"><div id="earned-bar"></div></div>
    <p class="tally-note" id="tally-note">Bronze 0 · Silver 0 · Gold 0 · Platinum 0</p>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab is-on" data-view="checklist">Checklist</button>
  <button class="tab" data-view="roadmap">Roadmap to platinum</button>
  <button class="tab" data-view="missables">Missables <span class="dot" id="miss-dot">6</span></button>
  <span class="tab-spacer"></span>
  <button class="ghost" id="export-btn" title="Download progress as JSON">Export</button>
  <button class="ghost" id="import-btn" title="Load a progress JSON file">Import</button>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</nav>

<main>
  <section id="view-checklist" class="view is-on">
    <div class="toolbar">
      <label class="search"><span>Search</span>
        <input id="search" type="search" placeholder="Trophy, mission, activity…" autocomplete="off">
      </label>
      <label>Grade
        <select id="f-grade">
          <option value="">All</option><option>platinum</option><option>gold</option><option>silver</option><option>bronze</option>
        </select>
      </label>
      <label>Kind
        <select id="f-kind"><option value="">All</option></select>
      </label>
      <label>State
        <select id="f-state"><option value="">All</option><option value="earned">Earned</option><option value="missing">Still open</option></select>
      </label>
      <label>Chapter
        <select id="f-chapter"><option value="">All</option></select>
      </label>
      <label class="switch"><input type="checkbox" id="spoiler-toggle"><span>Spoiler shield</span></label>
    </div>
    <p class="hint" id="result-hint"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section id="view-roadmap" class="view"></section>
  <section id="view-missables" class="view"></section>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="drawer-close" id="drawer-close" aria-label="Close">×</button>
  <div id="drawer-body"></div>
</aside>
<div class="scrim" id="scrim"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
